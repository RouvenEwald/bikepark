<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bikepark Lernkarten</title>
  <meta name="description" content="Bikepark-Training Karte für Karte: ein Merksatz pro Runde.">
  <meta name="theme-color" content="#edf0ea">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script>
    /* Theme sofort setzen, bevor die App lädt (verhindert Aufblitzen) */
    try { var t = localStorage.getItem("bp-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; else if (!t) document.documentElement.dataset.theme = "light"; } catch (e) { document.documentElement.dataset.theme = "light"; }
  </script>
</head>
<body>
  <div id="app"><main><p class="muted">Lädt …</p></main></div>
  <noscript><main><p>Diese App braucht JavaScript.</p></main></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
